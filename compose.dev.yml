# Infraestructura de desarrollo de New Horizons: Postgres, Kafka y LocalStack (S3 falso).
# - `name:` explícito: Compose nombra el proyecto por la carpeta y dos carpetas iguales se pisarían.
# - Puertos solo en 127.0.0.1: Docker se salta el cortafuegos, así que nada se publica fuera.
# - Datos en volúmenes con nombre: un volumen anónimo se borraría solo al quedar huérfano.
# - Las credenciales salen de .env (fuera de git). Copia .env.example si clonas el repo.
# Arranque: scripts/dev-up.sh
name: new-horizons-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: nh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: newhorizons
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["127.0.0.1:5434:5432"]
    volumes: [nh-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d newhorizons"]
      interval: 5s
      retries: 10

  # Kafka en modo KRaft: un solo nodo que hace de broker y de controlador, sin ZooKeeper.
  # Dos listeners: INTERNAL para contenedores de esta red y HOST para la app arrancada con mvnw.
  kafka:
    image: apache/kafka:4.3.1
    container_name: nh-kafka
    restart: unless-stopped
    ports: ["127.0.0.1:9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes: [nh-kafka:/var/lib/kafka/data]

volumes:
  nh-postgres:
  nh-kafka:
